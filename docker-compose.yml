services:
  gateway-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PROJECT_PATH: src/Backend/gateways/Aiyara.Gateways.Api/Aiyara.Gateways.Api.csproj
        APP_DLL: Aiyara.Gateways.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__FrontendOrigins: ${FRONTEND_ORIGIN:-http://localhost:3000},http://localhost:${TIMESHEET_REMOTE_PORT:-3002},http://localhost:${REPORTING_REMOTE_PORT:-3003},http://localhost:${ADMINISTRATION_REMOTE_PORT:-3004},http://localhost:${IDENTITY_PROFILE_REMOTE_PORT:-3005}
      Services__Identity__BaseUrl: http://identities-api:8080
      IdentityGrpc__Url: http://identities-api:8082
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identities-api:8080/
      ReverseProxy__Clusters__timesheet__Destinations__primary__Address: http://timesheet-api:8080/
      ReverseProxy__Clusters__reporting__Destinations__primary__Address: http://reports-api:8080/
      ReverseProxy__Clusters__notification__Destinations__primary__Address: http://notifications-api:8080/
    depends_on:
      identities-api:
        condition: service_healthy
      timesheet-api:
        condition: service_healthy
      reports-api:
        condition: service_healthy
      notifications-api:
        condition: service_healthy
    ports:
      - "${GATEWAY_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  identities-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PROJECT_PATH: src/Backend/identities/Aiyara.Identities.Api/Aiyara.Identities.Api.csproj
        APP_DLL: Aiyara.Identities.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Dependencies__Postgres__Host: postgres
      Dependencies__Redis__Host: redis
      ConnectionStrings__IdentityDb: Host=postgres;Database=identity_db;Username=identity_app;Password=${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      Paseto__Key: ${PASETO_SIGNING_SEED:?Set PASETO_SIGNING_SEED in .env}
      Notification__InternalKey: ${NOTIFICATION_INTERNAL_KEY:?Set NOTIFICATION_INTERNAL_KEY in .env}
      Notification__BaseUrl: http://notifications-api:8080
      Bootstrap__PlatformAdminEmail: ${BOOTSTRAP_PLATFORM_ADMIN_EMAIL:-}
      ASPNETCORE_Kestrel__Endpoints__Http__Url: http://+:8080
      ASPNETCORE_Kestrel__Endpoints__Grpc__Url: http://+:8082
      ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols: Http2
    depends_on:
      db-provisioner:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      notifications-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  timesheet-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PROJECT_PATH: src/Backend/timesheet/Aiyara.Timesheet.Api/Aiyara.Timesheet.Api.csproj
        APP_DLL: Aiyara.Timesheet.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Dependencies__Postgres__Host: postgres
      Dependencies__Redis__Host: redis
      Dependencies__RabbitMQ__Host: rabbitmq
      ConnectionStrings__TimesheetDb: Host=postgres;Database=timesheet_db;Username=timesheet_app;Password=${TIMESHEET_DB_PASSWORD:?Set TIMESHEET_DB_PASSWORD in .env}
      IdentityGrpc__Url: http://identities-api:8082
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    depends_on:
      db-provisioner:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      identities-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  reports-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PROJECT_PATH: src/Backend/reports/Aiyara.Report.Api/Aiyara.Report.Api.csproj
        APP_DLL: Aiyara.Report.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Dependencies__Postgres__Host: postgres
      ConnectionStrings__ReportingDb: Host=postgres;Database=reporting_db;Username=reporting_app;Password=${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD in .env}
    depends_on:
      db-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  notifications-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PROJECT_PATH: src/Backend/notifications/Aiyara.Notifications.Api/Aiyara.Notifications.Api.csproj
        APP_DLL: Aiyara.Notifications.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Dependencies__RabbitMq__Host: rabbitmq
      Dependencies__Postgres__Host: postgres
      ConnectionStrings__NotificationDb: Host=postgres;Database=notification_db;Username=notification_app;Password=${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      InternalApi__Key: ${NOTIFICATION_INTERNAL_KEY:?Set NOTIFICATION_INTERNAL_KEY in .env}
      Smtp__Host: ${SMTP_HOST:-maildev}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__UseTls: ${SMTP_USE_TLS:-false}
      Smtp__From: ${SMTP_FROM:-no-reply@aiyara.local}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
    depends_on:
      db-provisioner:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  report-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PROJECT_PATH: src/Backend/reports/Aiyara.Report.Worker/Aiyara.Report.Worker.csproj
        APP_DLL: Aiyara.Report.Worker.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Dependencies__RabbitMq__Host: rabbitmq
      Dependencies__RustFs__Host: rustfs
    depends_on:
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  timesheet-remote:
    build:
      context: ./src/Frontend
      dockerfile: app/Dockerfile
      args:
        PROJECT_DIR: remotes/timesheet
    environment:
      NITRO_PORT: 3002
      NUXT_PUBLIC_SHELL_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "${TIMESHEET_REMOTE_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3002').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  reporting-remote:
    build:
      context: ./src/Frontend
      dockerfile: app/Dockerfile
      args:
        PROJECT_DIR: remotes/reporting
    environment:
      NITRO_PORT: 3003
    ports:
      - "${REPORTING_REMOTE_PORT:-3003}:3003"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3003').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  administration-remote:
    build:
      context: ./src/Frontend
      dockerfile: app/Dockerfile
      args:
        PROJECT_DIR: remotes/administration
    environment:
      NITRO_PORT: 3004
      NUXT_PUBLIC_SHELL_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "${ADMINISTRATION_REMOTE_PORT:-3004}:3004"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3004').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  identity-profile-remote:
    build:
      context: ./src/Frontend
      dockerfile: app/Dockerfile
      args:
        PROJECT_DIR: remotes/identity-profile
    environment:
      NITRO_PORT: 3005
      NUXT_PUBLIC_SHELL_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "${IDENTITY_PROFILE_REMOTE_PORT:-3005}:3005"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3005').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  frontend:
    build:
      context: ./src/Frontend
      dockerfile: app/Dockerfile
      args:
        PROJECT_DIR: app
    environment:
      NUXT_PUBLIC_GATEWAY_URL: http://localhost:${GATEWAY_API_PORT:-8081}
      NUXT_PUBLIC_IDENTITY_REMOTE_URL: http://localhost:${IDENTITY_PROFILE_REMOTE_PORT:-3005}
      NUXT_PUBLIC_TIMESHEET_REMOTE_URL: http://localhost:${TIMESHEET_REMOTE_PORT:-3002}
      NUXT_PUBLIC_REPORTING_REMOTE_URL: http://localhost:${REPORTING_REMOTE_PORT:-3003}
      NUXT_PUBLIC_ADMINISTRATION_REMOTE_URL: http://localhost:${ADMINISTRATION_REMOTE_PORT:-3004}
    depends_on:
      gateway-api:
        condition: service_healthy
      timesheet-remote:
        condition: service_healthy
      reporting-remote:
        condition: service_healthy
      administration-remote:
        condition: service_healthy
      identity-profile-remote:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [timesheet]

  db-provisioner:
    image: postgres:17-alpine
    command: ["sh", "/scripts/provision-service-roles.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      TIMESHEET_DB_PASSWORD: ${TIMESHEET_DB_PASSWORD:?Set TIMESHEET_DB_PASSWORD in .env}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    volumes:
      - ./infrastructure/postgres/provision-service-roles.sh:/scripts/provision-service-roles.sh:ro
      - ./infrastructure/postgres/provision-service-roles.sql:/scripts/provision-service-roles.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [timesheet]

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks: [timesheet]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0-glibc
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [timesheet]

  maildev:
    image: maildev/maildev:2.1.0
    profiles: [maildev]
    ports:
      - "${MAILDEV_SMTP_PORT:-1025}:1025"
      - "${MAILDEV_WEB_PORT:-8080}:1080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:1080/healthz || wget -q --spider http://127.0.0.1:1080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [timesheet]

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [timesheet]

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks: [timesheet]

networks:
  timesheet:
    name: ${COMPOSE_NETWORK_NAME:-aiyara-timesheet}

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  rustfs-data:
  prometheus-data:
  grafana-data:
