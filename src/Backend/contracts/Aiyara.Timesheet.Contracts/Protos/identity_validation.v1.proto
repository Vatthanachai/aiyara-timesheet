syntax = "proto3";

package aiyara.timesheet.identity.v1;

option csharp_namespace = "Aiyara.Timesheet.Contracts.Identity.V1";

import "google/protobuf/timestamp.proto";

// Identity is the only service that may implement this synchronous contract.
service IdentityValidationService {
  rpc ValidateAccessToken (ValidateAccessTokenRequest) returns (ValidateAccessTokenResponse);
  rpc LookupProfile (LookupProfileRequest) returns (LookupProfileResponse);
  // A tenant's member group and the accounts in it now, for scheduled group reports.
  rpc ListGroupMembers (ListGroupMembersRequest) returns (ListGroupMembersResponse);
  // How a tenant shows dates and times, for documents rendered outside a browser.
  rpc GetOrganizationSettings (GetOrganizationSettingsRequest) returns (GetOrganizationSettingsResponse);
  // A tenant's active Tenant Admins and Employees, for reminders sent without a signed-in user.
  rpc ListMembers (ListMembersRequest) returns (ListMembersResponse);
}

message ValidateAccessTokenRequest {
  string access_token = 1;
  string correlation_id = 2;
}

message ValidateAccessTokenResponse {
  bool is_valid = 1;
  string subject_id = 2;
  string tenant_id = 3;
  repeated string roles = 4;
  google.protobuf.Timestamp expires_at_utc = 5;
  string failure_reason = 6;
  string token_id = 7;
  int64 session_version = 8;
  bool must_change_password = 9;
  int64 policy_version = 10;
  string time_zone_id = 11;
}

message LookupProfileRequest {
  string subject_id = 1;
  string tenant_id = 2;
  string correlation_id = 3;
}

message LookupProfileResponse {
  bool found = 1;
  string subject_id = 2;
  string tenant_id = 3;
  string email = 4;
  string first_name = 5;
  string last_name = 6;
  repeated string roles = 7;
  bool is_active = 8;
}

message ListGroupMembersRequest {
  string tenant_id = 1;
  string group_id = 2;
  string correlation_id = 3;
}

// found is false when the tenant has no such group (for example it was deleted).
message ListGroupMembersResponse {
  bool found = 1;
  string group_name = 2;
  repeated string member_ids = 3;
}

message GetOrganizationSettingsRequest {
  string tenant_id = 1;
  string correlation_id = 2;
}

// found is false for an unknown tenant; formats follow the organization's date and time setting.
message GetOrganizationSettingsResponse {
  bool found = 1;
  string date_format = 2;
  string time_format = 3;
  string time_zone_id = 4;
}

message ListMembersRequest {
  string tenant_id = 1;
  string correlation_id = 2;
}

// joined_at_utc is when the membership was created.
message TenantMember {
  string subject_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string role = 5;
  google.protobuf.Timestamp joined_at_utc = 6;
}

message ListMembersResponse {
  repeated TenantMember members = 1;
}
