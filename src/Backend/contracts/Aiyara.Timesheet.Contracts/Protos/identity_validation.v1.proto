syntax = "proto3";

package aiyara.timesheet.identity.v1;

option csharp_namespace = "Aiyara.Timesheet.Contracts.Identity.V1";

// This schema is deliberately checked in before code generation is enabled.
// Identity is the only service that may implement this synchronous contract.
service IdentityValidationService {
  rpc ValidateAccessToken (ValidateAccessTokenRequest) returns (ValidateAccessTokenResponse);
}

message ValidateAccessTokenRequest {
  string access_token = 1;
}

message ValidateAccessTokenResponse {
  bool is_valid = 1;
  string subject_id = 2;
  string tenant_id = 3;
  repeated string roles = 4;
  string expires_at_utc = 5;
  string failure_reason = 6;
}
